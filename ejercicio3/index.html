<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="estilos.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <a href="../index.html">Volver a los ejercicios</a>
    <p class="actividad">EJERCICIO 3 · switch</p>
    <h1>Calculadora</h1>
    <p class="descripcion">Ingresa dos números y elige la operación que deseas realizar.</p>
    <form id="formulario" novalidate>
      <label for="a">Primer número</label>
      <input id="a" name="a" type="number" step="any" required>
      <label for="b">Segundo número</label>
      <input id="b" name="b" type="number" step="any" required>
      <label for="operador">Operación</label>
      <select id="operador" name="operador">
        <option value="+">Sumar (+)</option>
        <option value="-">Restar (−)</option>
        <option value="*">Multiplicar (×)</option>
        <option value="/">Dividir (÷)</option>
      </select>
      <div class="acciones">
        <button type="submit">Calcular</button>
        <button type="reset">Limpiar</button>
      </div>
    </form>
    <p id="error" class="error" role="alert"></p>
    <section class="resultado" aria-labelledby="titulo-resultado" aria-live="polite">
      <h2 id="titulo-resultado">Resultado</h2>
      <div id="resultado">Completa el formulario y pulsa Calcular.</div>
    </section>
    <p class="nota">Los resultados numéricos se muestran con dos decimales. La división entre cero presenta un mensaje en la página.</p>
  </main>
</body>
</html>
